name: E2E attachments

on:
  workflow_dispatch:
  push:
    paths:
      - 'main/**'
      - 'preload/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run paste pipeline e2e (stub page)
        run: E2E_STUB=1 xvfb-run -a node scripts/e2e-attachments.js
